<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#667eea">
<link rel="manifest" href="manifest-shop1st.json">
<link rel="icon" type="image/svg+xml" href="icon-shop1st.svg">
<link rel="apple-touch-icon" href="icon-shop1st.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shop1st">
<meta name="mobile-web-app-capable" content="yes">
<title>Shop1st — متاجر المدير AI في مكان واحد</title>

<style>
:root {
    --primary: #667eea;
    --primary-dark: #764ba2;
    --secondary: #f39c12;
    --success: #27ae60;
    --danger: #e74c3c;
    --text: #2c3e50;
    --muted: #7f8c8d;
    --bg: #f5f7fa;
    --card: #ffffff;
    --border: #e9ecef;
    --nav-height: 66px;
}
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}
html, body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Kufi Arabic', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
}
body {
    padding-bottom: calc(var(--nav-height) + env(safe-area-inset-bottom, 0px));
}

/* ═══ Header ═══ */
.app-header {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    padding: 14px 18px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(102,126,234,0.25);
}
.app-header-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
}
.app-logo {
    width: 34px;
    height: 34px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(102,126,234,0.4);
    flex-shrink: 0;
    padding: 3px;
    box-sizing: border-box;
}
.app-title {
    font-size: 15px;
    font-weight: 800;
    flex: 1;
    min-width: 0;
    line-height: 1.3;
}
.app-title small {
    display: block;
    font-size: 10px;
    opacity: 0.85;
    font-weight: 500;
    margin-top: 1px;
}
.header-action {
    width: 34px;
    height: 34px;
    background: rgba(255,255,255,0.18);
    border: none;
    border-radius: 50%;
    color: white;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    padding: 0;
    transition: all 0.2s;
}
.header-action:active { transform: scale(0.92); }

/* ═══ Search Bar ═══ */
.search-wrap {
    position: relative;
}
.search-input {
    width: 100%;
    padding: 11px 42px 11px 14px;
    border: none;
    border-radius: 12px;
    background: rgba(255,255,255,0.95);
    color: var(--text);
    font-family: inherit;
    font-size: 13.5px;
    outline: none;
    transition: all 0.2s;
}
.search-input::placeholder { color: #95a5a6; }
.search-icon {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 15px;
    opacity: 0.5;
    pointer-events: none;
}

/* ═══ Tabs (Categories) ═══ */
.cats-scroll {
    display: flex;
    gap: 8px;
    padding: 10px 14px;
    overflow-x: auto;
    background: white;
    border-bottom: 1px solid var(--border);
    scrollbar-width: none;
}
.cats-scroll::-webkit-scrollbar { display: none; }
.cat-chip {
    padding: 7px 14px;
    border-radius: 18px;
    background: var(--bg);
    border: 1.5px solid var(--border);
    color: var(--text);
    font-size: 12.5px;
    font-weight: 700;
    font-family: inherit;
    white-space: nowrap;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.15s;
}
.cat-chip.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
}
.cat-chip:active { transform: scale(0.96); }

/* ═══ Content ═══ */
.app-content {
    padding: 14px;
}

/* ═══ Location Bar ═══ */
.location-bar {
    background: linear-gradient(135deg, #e8f0fe, #d4e0fc);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12.5px;
    color: #1565c0;
    font-weight: 600;
}
.location-bar .loc-icon {
    font-size: 18px;
    flex-shrink: 0;
}
.location-bar .loc-text {
    flex: 1;
    min-width: 0;
    line-height: 1.4;
}
.location-bar .loc-text small {
    display: block;
    font-size: 10.5px;
    font-weight: 500;
    opacity: 0.85;
    margin-top: 2px;
}

/* ═══ Section Title ═══ */
.section-title {
    font-size: 14px;
    font-weight: 800;
    color: var(--text);
    margin: 18px 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
}
.section-title .badge {
    background: var(--primary);
    color: white;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 700;
}

/* ═══ Store Card ═══ */
.store-card {
    background: white;
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    display: flex;
    gap: 12px;
    cursor: pointer;
    transition: all 0.2s;
    border: 1.5px solid transparent;
}
.store-card:active {
    transform: scale(0.99);
    border-color: var(--primary);
}
.store-logo {
    width: 60px;
    height: 60px;
    border-radius: 14px;
    background: linear-gradient(135deg, #f8f9fa, #e9ecef);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    flex-shrink: 0;
    background-size: cover;
    background-position: center;
}
.store-info {
    flex: 1;
    min-width: 0;
}
.store-name {
    font-size: 14.5px;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.store-meta {
    display: flex;
    gap: 10px;
    font-size: 11.5px;
    color: var(--muted);
    margin-bottom: 6px;
    flex-wrap: wrap;
}
.store-meta span {
    display: inline-flex;
    align-items: center;
    gap: 3px;
}
.store-status {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10.5px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 8px;
}
.store-status.open {
    background: #e8f5e9;
    color: #1b5e20;
}
.store-status.closed {
    background: #ffebee;
    color: #b71c1c;
}
.store-status.rate {
    background: #fff8e1;
    color: #7d4e00;
}

/* ═══ Bottom Navigation ═══ */
.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: calc(var(--nav-height) + env(safe-area-inset-bottom, 0px));
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: white;
    display: flex;
    align-items: stretch;
    box-shadow: 0 -2px 16px rgba(0,0,0,0.08);
    z-index: 1000;
    border-top: 1px solid var(--border);
}
.nav-btn {
    flex: 1;
    background: transparent;
    border: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    color: var(--muted);
    font-family: inherit;
    font-size: 10.5px;
    font-weight: 700;
    cursor: pointer;
    padding: 8px 4px;
    position: relative;
    transition: color 0.2s;
}
.nav-btn .nav-icon {
    font-size: 22px;
    line-height: 1;
    transition: transform 0.2s;
}
.nav-btn.active {
    color: var(--primary);
}
.nav-btn.active .nav-icon {
    transform: translateY(-2px) scale(1.1);
}
.nav-btn.active::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 30px;
    height: 3px;
    background: var(--primary);
    border-radius: 0 0 4px 4px;
}

/* ═══ Empty State ═══ */
.empty-state {
    text-align: center;
    padding: 50px 20px;
    color: var(--muted);
}
.empty-state .icon {
    font-size: 56px;
    margin-bottom: 12px;
    opacity: 0.5;
}
.empty-state .title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
}
.empty-state .desc {
    font-size: 12.5px;
    line-height: 1.6;
    max-width: 260px;
    margin: 0 auto;
}

/* ═══ Shop1st Splash ═══ */
#shop1stSplash {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 99999;
    padding: 20px;
    opacity: 1;
    transition: opacity 0.4s ease, visibility 0.4s ease;
}
#shop1stSplash.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}
.splash-logo {
    width: 110px;
    height: 110px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    border-radius: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px;
    box-sizing: border-box;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3), inset 0 1px 1px rgba(255,255,255,0.25);
    margin-bottom: 24px;
    animation: splashLogoIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes splashLogoIn {
    from { opacity: 0; transform: scale(0.6) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
}
.splash-name {
    font-size: 32px;
    font-weight: 900;
    color: white;
    letter-spacing: 1px;
    text-shadow: 0 4px 16px rgba(0,0,0,0.25);
    margin-bottom: 8px;
    animation: splashFadeIn 0.8s ease 0.2s backwards;
}
.splash-tagline {
    font-size: 13px;
    color: rgba(255,255,255,0.9);
    font-weight: 600;
    animation: splashFadeIn 0.8s ease 0.35s backwards;
    text-align: center;
}
@keyframes splashFadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}
.splash-dots {
    display: flex;
    gap: 8px;
    margin-top: 36px;
    animation: splashFadeIn 0.8s ease 0.5s backwards;
}
.splash-dots span {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: rgba(255,255,255,0.9);
    animation: splashDot 1.2s ease-in-out infinite;
}
.splash-dots span:nth-child(2) { animation-delay: 0.15s; }
.splash-dots span:nth-child(3) { animation-delay: 0.3s; }
@keyframes splashDot {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
    40% { transform: scale(1); opacity: 1; }
}

/* ═══ Loading (داخلي) ═══ */
.loading-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    gap: 14px;
    color: var(--primary);
}
.loading-spinner {
    width: 40px;
    height: 40px;
    border: 3.5px solid rgba(102,126,234,0.2);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ═══ Browse Tabs ═══ */
.browse-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    background: white;
    padding: 6px;
    border-radius: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.browse-tab {
    flex: 1;
    padding: 11px;
    border: none;
    background: transparent;
    border-radius: 10px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
}
.browse-tab.active {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    box-shadow: 0 3px 10px rgba(102,126,234,0.3);
}
.browse-tab:active { transform: scale(0.97); }

/* ═══ Sort ═══ */
.browse-sort {
    margin-bottom: 14px;
}

/* ═══ Product Card ═══ */
.product-card {
    background: white;
    border-radius: 14px;
    padding: 10px;
    margin-bottom: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    display: flex;
    gap: 10px;
    cursor: pointer;
    transition: all 0.2s;
    border: 1.5px solid transparent;
}
.product-card:active {
    transform: scale(0.99);
    border-color: var(--primary);
}
.product-img {
    width: 76px;
    height: 76px;
    border-radius: 12px;
    background-size: cover;
    background-position: center;
    flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
}
.product-img-ph {
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #f8f9fa, #e9ecef);
    font-size: 32px;
    color: #95a5a6;
}
.product-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
}
.product-name {
    font-size: 14px;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 3px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.product-store {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.product-desc {
    font-size: 11px;
    color: #95a5a6;
    line-height: 1.4;
    margin-bottom: 5px;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
}
.product-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-top: auto;
}
.product-price {
    font-size: 14px;
    font-weight: 800;
    color: var(--success);
    white-space: nowrap;
}
.product-price-usd {
    display: inline-block;
    margin-right: 4px;
    padding: 1px 6px;
    background: #e8f5e9;
    color: #1b5e20;
    border: 1px solid var(--success);
    border-radius: 5px;
    font-size: 10px;
    font-weight: 800;
    direction: ltr;
}
.product-add {
    padding: 6px 12px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    border: none;
    border-radius: 16px;
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    transition: all 0.15s;
}
.product-add:active { transform: scale(0.94); }

/* ═══ Auth Prompt Modal ═══ */
#authPromptModal, #wrongTypeModal {
    animation: modalFadeIn 0.2s ease;
}
@keyframes modalFadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
}
#authPromptModal > div, #wrongTypeModal > div {
    animation: modalSlideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
@keyframes modalSlideUp {
    from { transform: translateY(30px) scale(0.95); opacity: 0; }
    to   { transform: translateY(0) scale(1); opacity: 1; }
}

/* ═══════ Dark Mode ═══════ */
body.dark-mode {
    background: #121212 !important;
    color: #e0e0e0 !important;
}
body.dark-mode .app-content {
    background: #121212 !important;
}
body.dark-mode #appContent > div {
    background: #121212 !important;
}
body.dark-mode #appContent div[style*="background:white"],
body.dark-mode #appContent div[style*="background: white"] {
    background: #1e1e2e !important;
}
body.dark-mode #appContent div[style*="color:#2c3e50"],
body.dark-mode #appContent div[style*="color: #2c3e50"] {
    color: #e0e0e0 !important;
}
body.dark-mode #appContent div[style*="color:#7f8c8d"],
body.dark-mode #appContent div[style*="color: #7f8c8d"] {
    color: #a0a0b0 !important;
}
body.dark-mode #appContent div[style*="color:#95a5a6"],
body.dark-mode #appContent div[style*="color: #95a5a6"] {
    color: #808090 !important;
}
body.dark-mode #appContent div[style*="color:#bdc3c7"],
body.dark-mode #appContent div[style*="color: #bdc3c7"] {
    color: #606070 !important;
}
body.dark-mode #appContent div[style*="background:#f5f7fa"],
body.dark-mode #appContent div[style*="background: #f5f7fa"] {
    background: #121212 !important;
}
body.dark-mode #appContent div[style*="background:#f0f0f0"],
body.dark-mode #appContent div[style*="background:#f0f0f0"] {
    background: #2a2a3e !important;
}
body.dark-mode .cats-scroll {
    background: #1a1a1a !important;
}
body.dark-mode .cat-chip {
    background: #1e1e2e !important;
    color: #b0b0b0 !important;
    border-color: #2a2a3e !important;
}
body.dark-mode .cat-chip.active {
    background: #8e44ad !important;
    color: white !important;
}
body.dark-mode .bottom-nav {
    background: #1e1e2e !important;
    border-top-color: #2a2a3e !important;
}
body.dark-mode .nav-btn {
    color: #808090 !important;
}
body.dark-mode .nav-btn.active {
    color: #b088e0 !important;
}
body.dark-mode .search-input {
    background: #1e1e2e !important;
    color: #e0e0e0 !important;
}
body.dark-mode .search-input::placeholder {
    color: #606070 !important;
}
body.dark-mode #appContent button[style*="background:white"],
body.dark-mode #appContent button[style*="background: white"] {
    background: #1e1e2e !important;
    color: #e0e0e0 !important;
}

    color: #e8e8f0 !important;

body.dark-mode .loading-screen {

}
body.dark-mode .loading-spinner {
    border-color: #2a2a3e !important;

}

}

}

}

}

}

/* 📍 شريط الموقع */

    background: #1a1a2e !important;
    color: #e8e8f0 !important;

}

/* 🔍 البحث */
body.dark-mode .search-wrap {
    background: transparent !important;
}
body.dark-mode .search-input {
    background: #1a1a2e !important;
    color: #e8e8f0 !important;
    border-color: #2a2a3e !important;
}
body.dark-mode .search-input::placeholder {
    color: #606070 !important;
}

/* 📑 عناوين الأقسام */
body.dark-mode .section-title {
    color: #e8e8f0 !important;
}

    background: #1a1a2e !important;

}
body.dark-mode .browse-tab.active {
    background: #2a1f3d !important;
