name: Build Al-Mudir APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}

      - name: Install dependencies
        run: npm install

      - name: Clean Android directory
        run: rm -rf android/

      - name: Add Android platform
        run: npx cap add android

      - name: Force Sync Android Plugins
        run: npx cap sync android

      - name: Sync Capacitor (Force Android)
        run: npx cap sync android

      - name: Register BarcodeScanner Plugin (Manual)
        run: |
          PLUGINS_JSON="android/app/src/main/assets/capacitor.plugins.json"
          mkdir -p "$(dirname "$PLUGINS_JSON")"
          if [ ! -f "$PLUGINS_JSON" ]; then echo "[]" > "$PLUGINS_JSON"; fi
          if ! grep -q "BarcodeScannerPlugin" "$PLUGINS_JSON"; then
            python3 -c "import json; p='android/app/src/main/assets/capacitor.plugins.json'; d=json.load(open(p)); d.append({'pkg':'@capacitor-mlkit/barcode-scanning','classpath':'io.capawesome.capacitorjs.plugins.mlkit.barcodescanning.BarcodeScannerPlugin'}); json.dump(d, open(p,'w'), indent=2)"
          fi
          echo "=== capacitor.plugins.json ==="
          cat "$PLUGINS_JSON"

          MAIN_ACT="android/app/src/main/java/com/jasoft/almudir/MainActivity.java"
          if [ -f "$MAIN_ACT" ]; then
            if ! grep -q "BarcodeScannerPlugin" "$MAIN_ACT"; then
              sed -i '1i import io.capawesome.capacitorjs.plugins.mlkit.barcodescanning.BarcodeScannerPlugin;' "$MAIN_ACT"
              sed -i 's|super.onCreate(savedInstanceState);|registerPlugin(BarcodeScannerPlugin.class);\n        super.onCreate(savedInstanceState);|' "$MAIN_ACT"
              echo "✅ MainActivity patched"
            fi
            echo "=== MainActivity.java ==="
            cat "$MAIN_ACT"
          fi

      - name: Force Bundled Model for ML Kit
        run: |
          APP_GRADLE="android/app/build.gradle"
          if [ -f "$APP_GRADLE" ]; then
            if ! grep -q "mlkit.barcode.scanning.bundled" "$APP_GRADLE"; then
              echo "" >> "$APP_GRADLE"
              echo "dependencies {" >> "$APP_GRADLE"
              echo "    implementation 'com.google.mlkit:barcode-scanning:17.2.0'" >> "$APP_GRADLE"
              echo "}" >> "$APP_GRADLE"
            fi
            echo "=== Gradle ==="
            cat "$APP_GRADLE" | tail -20
          fi

      - name: Add Android permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n\n    <application|' "$MANIFEST"
          fi
          echo "✅ Permissions applied"

      - name: Force Register BarcodeScanner in MainActivity
        run: |
          MAIN_ACTIVITY="android/app/src/main/java/com/jasoft/almudir/MainActivity.java"
          echo "=== MAIN ACTIVITY BEFORE ==="
          cat "$MAIN_ACTIVITY" 2>/dev/null || echo "File not found"
          
          cat > "$MAIN_ACTIVITY" << 'JAVA_EOF'
          package com.jasoft.almudir;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          import com.spare.capacitor.barcodescanner.BarcodeScanner;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(BarcodeScanner.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA_EOF
          
          echo ""
          echo "=== MAIN ACTIVITY AFTER ==="
          cat "$MAIN_ACTIVITY"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk "artifacts/المدير.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: almudir-apk
          path: artifacts/المدير.apk
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.4.1-${{ github.run_number }}
          name: Al-Mudir v2.4.1
          files: artifacts/المدير.apk
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
